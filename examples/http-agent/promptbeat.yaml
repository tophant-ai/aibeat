target:
  file: target.yaml

scenarios:
  files:
    - scenarios.yaml

seeds:
  files:
    - seeds.yaml

generation:
  generator_provider: openai:gpt-4o

backend:
  promptfoo:
    targets:
      - id: http
        label: Support agent HTTP endpoint
        config:
          url: http://localhost:8088/eval/run
          method: POST
          headers:
            content-type: application/json
            authorization: Bearer {{env.AGENT_EVAL_TOKEN}}
          body:
            prompt: '{{prompt}}'
            scenario_id: '{{scenarioId}}'
            tenant_id: tenant-a
            user_id: user-123
          transformResponse: json.answer
    num_tests: 3
    output: artifacts/promptfoo.redteam.yaml
    cases_output: artifacts/generated_cases.json
