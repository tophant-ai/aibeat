target:
  file: target.yaml

generation:
  mode: scc-waf

scenarios:
  files:
    - scenarios.yaml

seeds:
  files:
    - seeds.yaml

providers:
  generator:
    provider: openai:openai/gpt-5.4
  targets:
    - id: http
      config:
        url: http://127.0.0.1:8080/chat
        method: POST

backend:
  promptfoo:
    output: artifacts/scc_waf/promptfoo.redteam.yaml
    cases_output: artifacts/scc_waf/generated_cases.json
    num_tests: 1
