target:
  file: target.yaml

scenarios:
  files:
    - scenarios.yaml

seeds:
  files:
    - seeds.yaml

generation:
  # Attacker/generator model. Override with --generator-provider or PROMPTBEAT_GENERATOR_PROVIDER.
  generator_provider: openai:gpt-4o

backend:
  promptfoo:
    targets:
      - provider: openai:gpt-4o-mini
    num_tests: 3
    output: artifacts/promptfoo.redteam.yaml
    cases_output: artifacts/generated_cases.json
