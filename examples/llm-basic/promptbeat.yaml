target:
  file: target.yaml

scenarios:
  files:
    - scenarios.yaml

seeds:
  files:
    - seeds.yaml

providers:
  generator:
    provider: "{{ env.ATTACKER_MODEL_NAME }}"
    config:
      apiBaseUrl: "{{ env.ATTACKER_BASE_URL }}"
      apiKey: "{{ env.ATTACKER_API_KEY }}"
  judge:
    provider: "{{ env.JUDGE_MODEL_NAME }}"
    config:
      apiBaseUrl: "{{ env.JUDGE_BASE_URL }}"
      apiKey: "{{ env.JUDGE_API_KEY }}"
  targets:
    - provider: "{{ env.TARGET_MODEL_NAME }}"
      config:
        apiBaseUrl: "{{ env.TARGET_BASE_URL }}"
        apiKey: "{{ env.TARGET_API_KEY }}"

backend:
  promptfoo:
    num_tests: 3
    output: artifacts/promptfoo.redteam.yaml
    cases_output: artifacts/generated_cases.json
